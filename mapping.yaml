        type: id
      - name: geometry
        type: geometry
      - name: name
        type: string
        key: name
      - name: type
        type: mapping_value
        aliases:
          ford:
            __any__: ford
          obstacle:
            vegetation: obstacle_vegetation
            dense_vegetation: obstacle_vegetation
            fallen_tree: obstacle_tree
            fallen_trees: obstacle_tree
            fallen trees: obstacle_tree
            deadwood: obstacle_tree
            branches: obstacle_tree
            tree: obstacle_tree
            trees: obstacle_tree
            root: obstacle_tree
            landslide: obstacle_landslide
            hole: obstacle_hole
            heap: obstacle_heap
            precipice: obstacle_precipice
            rock: obstacle_rock
            rocks: obstacle_rock
            __any__: obstacle_yes
      - name: under
        type: expression
        args:
          expression: 'hasPrefix(get(tags, "location") ?? "", "under") ? "1" : ""'
    filters:
      reject:
        ford:
          - "no"
    type: linestring
    mappings:
      obstacle:
