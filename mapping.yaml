  power_generators:
    columns:
      - name: osm_id
        type: id
      - name: geometry
        type: geometry
      - name: name
        type: string
        key: name
      - name: source
        type: expression
        args:
          expression: 'tags.power == "plant" ? get(tags, "plant:source") ?? "" : tags.power == "generator" ? get(tags, "generator:source") ?? "" : ""'
      - name: method
        type: expression
        args:
          expression: 'tags.power == "plant" ? get(tags, "plant:method") ?? "" : tags.power == "generator" ? get(tags, "generator:method") ?? "" : ""'
    type: geometry
    type_mappings:
      points:
        power:
          - plant
          - generator
      polygons:
        power:
          - plant
          - generator

