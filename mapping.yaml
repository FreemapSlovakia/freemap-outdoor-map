    relation_types:
      - route
    mapping:
      route:
        - hiking
        - bicycle
        - ski
        - horse
        - piste
        - foot
        - mtb
        - running
    columns:
      - name: osm_id
        type: id
      - name: name
        type: string
        key: name
      - name: ref
        type: string
        key: ref
      - name: operator
        type: string
        key: operator
      - name: colour
        type: string
        key: colour
      - name: state
        type: string
        key: state
      - name: osmc:symbol
        type: string
        key: osmc:symbol
      - name: network
        type: string
        key: network
      - name: type
        type: mapping_value

