---
use_single_id_space: true
areas:
  area_tags:
    - building
    - landuse
    - leisure
    - waterway
    # - natural
    - aeroway
  linear_tags:
    - highway
    - barrier
tags:
  include:
    - abandoned
    - access
    - assisted_trail
    - bicycle
    - covered
    - denotation
    - diplomatic
    - disused
    - drinking_water
    - ele
    - fee
    - generator:method
    - generator:source
    - hiking
    - horse
    - icao
    - intermittent
    - ladder
    - location
    - operator
    - plant:method
    - plant:source
    - protect_class
    - protected
    - ref
    - refitted
    - ruins
    - rungs
    - safety_rope
    - seasonal
    - shelter_type
    - ski
    - telescope:type
    - tower:construction
    - tower:type
    - vending
    - water_characteristic
    - wetland
  include_regex:
    - ^(disused|abandoned|ruins|demolished|removed|destroyed|was):(leisure|natural|amenity|highway)
generalized_tables:
  waterareas_gen1:
    source: waterareas
    sql_filter: ST_Area(geometry)>50000.000000
    tolerance: 50
  waterareas_gen0:
    source: waterareas_gen1
    sql_filter: ST_Area(geometry)>500000.000000
    tolerance: 200
  roads_gen0:
    source: roads
    sql_filter:
      type IN ('motorway', 'motorway_link', 'trunk', 'trunk_link', 'primary',
      'primary_link', 'secondary', 'secondary_link', 'tertiary', 'tertiary_link')
      OR class IN('railway')
    tolerance: 200
  roads_gen1:
    source: roads
    sql_filter:
      type IN ('motorway', 'motorway_link', 'trunk', 'trunk_link', 'primary',
      'primary_link', 'secondary', 'secondary_link', 'tertiary', 'tertiary_link')
      OR class IN('railway')
    tolerance: 50
  waterways_gen0:
    source: waterways_gen1
    sql_filter: type='river' OR type='canal'
    tolerance: 200
  waterways_gen1:
    source: waterways
    sql_filter: type='river' OR type='canal'
    tolerance: 50
  landcovers_gen1:
    source: landcovers
    sql_filter: ST_Area(geometry)>50000.000000
    tolerance: 50
  landcovers_gen0:
    source: landcovers_gen1
    sql_filter: ST_Area(geometry)>500000.000000
    tolerance: 200
  route_members_gen0:
    source: route_members_gen1
    tolerance: 200
  route_members_gen1:
    source: route_members
    tolerance: 50
  admin_members_gen0:
    source: admin_members_gen1
    tolerance: 200
  admin_members_gen1:
    source: admin_members
    tolerance: 50

tables:
  admin_relations:
    type: relation
    relation_types: [boundary]
    mapping:
      boundary: [administrative]
    filters:
      require:
        admin_level: ["2"]
    columns:
      - { name: osm_id, type: id }
      - { name: admin_level, type: integer, key: admin_level }
      - { name: iso3166_1, type: string, key: "ISO3166-1" }

  admin_members:
    type: relation_member
    relation_types: [boundary]
    mapping:
      boundary: [administrative]
    filters:
      require:
        admin_level: ["2"]
    columns:
      - { name: osm_id, type: id }
      - { name: member, type: member_id }
      - { name: geometry, type: geometry }
      - { name: role, type: member_role, key: role }
      - { name: type, type: member_type }

  routes:
